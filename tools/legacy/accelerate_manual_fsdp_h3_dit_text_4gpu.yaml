# The outer training module is intentionally not FSDP-wrapped by Accelerate.
# train_scope_ref2va.py manually wraps only pipe.dit and pipe.text_encoder;
# this leaves video/audio VAEs on CPU and prevents a root flat parameter.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
use_cpu: false
